name: dosely
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_timezone: ^5.1.0
  google_mlkit_text_recognition: ^0.16.0
  google_sign_in: ^7.2.0
  image_picker: ^1.2.3
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.1
  shared_preferences: ^2.5.5
  speech_to_text: ^7.4.0
  supabase_flutter: ^2.17.1
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1

# permission_handler_android 14.0.0 ships a build.gradle.kts that fails to
# compile against this project's Kotlin Gradle Plugin version ("Unresolved
# reference: compilerOptions"). Pin to the last known-good release.
dependency_overrides:
  permission_handler_android: 13.0.1

flutter:
  uses-material-design: true
