name: dosely
description: "A minimalist Android medicine reminder."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  drift: ^2.34.3
  # Encryption is sqlite3 + sqlite3mc (hooks below), not sqlcipher_flutter_libs
  # 0.7.0+eol and not drift_flutter. Do not add either.
  # Push. Both are needed even though the app only ever *receives*: the native
  # Firebase app has to be configured at process start for a notification to be
  # drawn while the app is dead, and that configuration comes from
  # android/app/google-services.json (git-ignored — see README's Push section).
  # Without the file the app still builds and runs, just without push.
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  # Keystore (Android EncryptedSharedPreferences) / Keychain (iOS) for the
  # Supabase session. Without this, supabase_flutter writes the refresh token
  # into plaintext FlutterSharedPreferences.xml.
  flutter_secure_storage: ^9.2.4
  flutter_timezone: ^5.1.0
  google_mlkit_text_recognition: ^0.16.0
  google_sign_in: ^7.2.0
  # In-app rear preview for label scan. The system camera app (image_picker)
  # ignores facing extras and reopens the last lens — often the selfie camera.
  camera: ^0.12.0+2
  # Device PIN / pattern / biometric re-unlock after the app has been in the
  # background. biometricOnly is left off so a fingerprint is not required —
  # the person this app is for already has a phone PIN.
  local_auth: ^2.3.0
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.1
  sentry_flutter: ^9.26.0
  share_plus: ^11.1.0
  shared_preferences: ^2.5.5
  # SHA-256 of the on-screen consent sentences stored with the Art. 7 record.
  crypto: ^3.0.7
  # Direct so the sqlite3mc native-assets hook below applies. Encryption
  # needs SQLite3MultipleCiphers, not the default unencrypted SQLite.
  sqlite3: ^3.5.1
  speech_to_text: ^7.4.0
  supabase_flutter: ^2.17.1
  timezone: ^0.11.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  # For test/support/fake_supabase.dart: MockClient stands in for the network
  # so SyncService can be driven end to end. Already present transitively via
  # supabase_flutter; named here because the tests import it directly.
  http: ^1.5.0

# Rechecked 2026-08-19 against Kotlin Gradle Plugin 2.2.20
# (app/android/settings.gradle.kts). permission_handler_android 14.0.0 still
# fails to compile:
#   Unresolved reference: compilerOptions
# in its android/build.gradle.kts (`kotlin { compilerOptions { jvmTarget } }`).
# Keep the pin until that plugin compiles against this KGP.
dependency_overrides:
  permission_handler_android: 13.0.1

# Bundle SQLite3MultipleCiphers instead of upstream SQLite so NativeDatabase
# can PRAGMA key the on-device medical file. See
# https://drift.simonbinder.eu/platforms/encryption/
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true
  assets:
    - assets/PRIVACY.md
  fonts:
    - family: Public Sans
      fonts:
        - asset: assets/fonts/PublicSans-Variable.ttf
