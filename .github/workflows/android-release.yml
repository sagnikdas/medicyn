name: Build signed Android release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # GitHub Actions rejects `secrets.X` referenced directly inside an `if:`
    # conditional at workflow-parse time ("Unrecognized named-value:
    # 'secrets'") — this fails even a workflow_dispatch attempt, before any
    # job runs. Routing the optional secret through a job-level env var
    # lets the "Materialize Firebase config" step's `if:` check it safely.
    env:
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Require protected signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
      - name: Materialize signing inputs outside Git
        working-directory: app/android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$GITHUB_WORKSPACE/upload-keystore.jks"
          {
            echo "storeFile=$GITHUB_WORKSPACE/upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties
      - name: Materialize Firebase config (optional)
        if: ${{ env.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        working-directory: app/android/app
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > google-services.json
      - name: Build signed AAB
        working-directory: app
        run: |
          flutter pub get
          flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: medicyn-release-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
