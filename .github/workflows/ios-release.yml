name: Build signed iOS release (manual)

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Upload the signed IPA to TestFlight after exporting it
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release:
    name: Archive, sign, and export iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60
    environment: ios-release
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Require protected iOS signing inputs
        shell: bash
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          UPLOAD_TO_TESTFLIGHT: ${{ inputs.upload_to_testflight }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.ASC_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          for variable in \
            IOS_CERTIFICATE_P12_BASE64 \
            IOS_CERTIFICATE_PASSWORD \
            IOS_PROVISIONING_PROFILE_BASE64 \
            IOS_PROVISIONING_PROFILE_NAME \
            IOS_TEAM_ID; do
            if [[ -z "${!variable:-}" ]]; then
              missing+=("$variable")
            fi
          done

          if [[ "$UPLOAD_TO_TESTFLIGHT" == "true" ]]; then
            for variable in ASC_API_KEY_ID ASC_ISSUER_ID ASC_API_PRIVATE_KEY_BASE64; do
              if [[ -z "${!variable:-}" ]]; then
                missing+=("$variable")
              fi
            done
          fi

          if ((${#missing[@]})); then
            echo "::error::Signed iOS release is blocked until these ios-release environment secrets are configured: ${missing[*]}"
            exit 1
          fi

          echo "Protected signing inputs are present; no placeholder certificate or profile will be used."

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: stable
          cache: true

      - name: Materialize Firebase config (optional)
        if: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 != '' }}
        shell: bash
        env:
          IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          printf '%s' "$IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 -D > app/ios/Runner/GoogleService-Info.plist

      - name: Resolve Dart and CocoaPods inputs
        working-directory: app
        run: |
          flutter pub get
          pod install --project-directory=ios

      - name: Install signing certificate and provisioning profile
        shell: bash
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/medicyn-signing.keychain-db"
          keychain_password="$(uuidgen)"
          certificate_path="$RUNNER_TEMP/ios-distribution.p12"
          profile_path="$RUNNER_TEMP/ios-distribution.mobileprovision"
          profile_plist="$RUNNER_TEMP/ios-distribution-profile.plist"

          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate_path"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$profile_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          security cms -D -i "$profile_path" > "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print:UUID' "$profile_plist")"
          profile_app_id="$(/usr/libexec/PlistBuddy -c 'Print:Entitlements:application-identifier' "$profile_plist")"
          test "$profile_app_id" = "$IOS_TEAM_ID.com.sagnikdas.medicyn"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_path" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"

          signing_identity="$(security find-identity -v -p codesigning "$keychain_path" \
            | awk -F'"' '/^[[:space:]]*[0-9]+\)/ { print $2; exit }')"
          test -n "$signing_identity"

          {
            echo "IOS_KEYCHAIN_PATH=$keychain_path"
            echo "IOS_PROFILE_UUID=$profile_uuid"
            echo "IOS_SIGNING_IDENTITY=$signing_identity"
          } >> "$GITHUB_ENV"

      - name: Match aps-environment to the distribution profile
        shell: bash
        run: |
          set -euo pipefail
          # Runner.entitlements is checked in with aps-environment=development
          # for local/simulator Xcode runs. A distribution provisioning
          # profile only ever grants "production" for that key, and manual
          # code signing (used below) fails the archive outright if the
          # entitlements file asks for anything the profile doesn't list —
          # "doesn't support the Push Notifications capability" — so this
          # rewrites the checked-out file to whatever the actual profile
          # grants rather than hardcoding "production" here.
          profile_plist="$RUNNER_TEMP/ios-distribution-profile.plist"
          entitlements_path="app/ios/Runner/Runner.entitlements"
          aps_environment="$(/usr/libexec/PlistBuddy -c 'Print:Entitlements:aps-environment' "$profile_plist" 2>/dev/null || true)"
          if [[ -z "$aps_environment" ]]; then
            echo "::error::The distribution provisioning profile has no aps-environment entitlement — enable Push Notifications for com.sagnikdas.medicyn in the Apple Developer portal and regenerate the profile."
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Set :aps-environment $aps_environment" "$entitlements_path"
          echo "aps-environment set to $aps_environment for this archive."

      - name: Archive and export signed IPA
        shell: bash
        env:
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/Medicyn.xcarchive"
          export_path="$RUNNER_TEMP/medicyn-export"
          export_options="$RUNNER_TEMP/ExportOptions.plist"

          xcodebuild \
            -workspace app/ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_IDENTITY="$IOS_SIGNING_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROVISIONING_PROFILE_NAME"

          cat > "$export_options" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.sagnikdas.medicyn</key>
              <string>$IOS_PROVISIONING_PROFILE_NAME</string>
            </dict>
            <key>signingCertificate</key>
            <string>$IOS_SIGNING_IDENTITY</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$IOS_TEAM_ID</string>
          </dict>
          </plist>
          EOF

          mkdir -p "$export_path"
          xcodebuild \
            -exportArchive \
            -archivePath "$archive_path" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$export_options"

          ipa_path="$(find "$export_path" -type f -name '*.ipa' -print -quit)"
          test -n "$ipa_path"
          mkdir -p app/build/ios
          cp "$ipa_path" app/build/ios/Medicyn-release.ipa

      - name: Upload signed iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: medicyn-ios-release-${{ github.run_number }}
          path: app/build/ios/Medicyn-release.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload IPA to TestFlight
        if: ${{ inputs.upload_to_testflight }}
        shell: bash
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.ASC_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          api_key_path="$RUNNER_TEMP/AuthKey_${ASC_API_KEY_ID}.p8"
          printf '%s' "$ASC_API_PRIVATE_KEY_BASE64" | base64 -D > "$api_key_path"
          xcrun iTMSTransporter \
            -m upload \
            -assetFile app/build/ios/Medicyn-release.ipa \
            -apiKey "$ASC_API_KEY_ID" \
            -apiIssuer "$ASC_ISSUER_ID"

      - name: Remove temporary signing material
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${IOS_PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"
          fi
          if [[ -n "${IOS_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$IOS_KEYCHAIN_PATH" || true
          fi
