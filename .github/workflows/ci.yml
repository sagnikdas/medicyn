name: Validate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: stable
          cache: true
      - name: Flutter checks
        working-directory: app
        run: |
          flutter pub get
          # The repository contains legacy files formatted by older Dart
          # versions; report drift without making unrelated files a CI gate.
          dart format --output=none lib test
          flutter analyze
          flutter test

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge function tests
        run: |
          for function_dir in supabase/functions/*; do
            if [ -f "$function_dir/deno.json" ]; then
              (cd "$function_dir" && deno test --allow-env --allow-net --allow-read .)
            fi
          done
